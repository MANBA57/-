distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 原值：https\://services.gradle.org/distributions/gradle-8.11.1-all.zip
# 换成腾讯云镜像：services.gradle.org 在本机虽可达，但境外下载慢且不稳定；
# 该镜像的 8.11.1 已实测 200。GRADLE_USER_HOME 被 build-apk.ps1 指到项目内，
# 因此 wrapper 的下载与缓存也都落在工作区内（沙箱禁止写工作区之外）。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.11.1-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
